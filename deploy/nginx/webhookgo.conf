# nginx in front of webhookgo: nginx installed on the host, the app container
# published on 127.0.0.1:8080, and a Let's Encrypt certificate from certbot.
#
# 1. In .env, then `docker compose up -d`:
#      PORT=127.0.0.1:8080          # not reachable from outside, only via nginx
#      PUBLIC_URL=https://hooks.example.com
#      TRUST_PROXY=1
# 2. Point the domain's DNS at this server and get a certificate (certbot
#    renews it, and reloads nginx, by itself):
#      sudo certbot certonly --nginx -d hooks.example.com
# 3. Replace hooks.example.com below, copy this file to
#    /etc/nginx/conf.d/webhookgo.conf and run:
#      sudo nginx -t && sudo systemctl reload nginx
#
# Behind Cloudflare's proxy (orange cloud), let nginx take the client address
# from CF-Connecting-IP, but only on connections from Cloudflare's ranges, so a
# request sent straight to this server can't forge it. TRUST_PROXY stays 1.
# Write the ranges to a file (run it again if Cloudflare adds ranges) and
# uncomment the include line below:
#      { for v in v4 v6; do curl -fsS https://www.cloudflare.com/ips-$v; echo; done |
#          sed '/^$/d; s/.*/set_real_ip_from &;/'
#        echo 'real_ip_header CF-Connecting-IP;'
#      } | sudo tee /etc/nginx/cloudflare-realip.conf
#
# "http2 on" needs nginx 1.25.1+. On older versions delete it and write
# "listen 443 ssl http2;" instead.

upstream webhookgo {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hooks.example.com;

    ssl_certificate     /etc/letsencrypt/live/hooks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.example.com/privkey.pem;

    # Behind Cloudflare's proxy (see the top of this file).
    # include /etc/nginx/cloudflare-realip.conf;

    # Webhooks arrive with all sorts of headers and bodies: keep them intact.
    client_max_body_size 32m;          # at least MAX_BODY_SIZE; above it the app stores a truncated body
    large_client_header_buffers 8 64k; # long tokens and signatures
    underscores_in_headers on;         # nginx drops X_Custom-style headers otherwise
    ignore_invalid_headers off;
    gzip off;                          # custom responses go out byte for byte; the app compresses its own assets

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    # Longer than MAX_DELAY (30 s) and the 20 s live-stream ping. The live
    # stream needs no block of its own: the app sends X-Accel-Buffering: no.
    proxy_read_timeout 90s;

    # Webhook URLs (/<uuid>/...) also answer over plain HTTP, like webhook.site,
    # because some senders and devices cannot do TLS.
    location ~* "^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(/|$)" {
        proxy_pass http://webhookgo;
    }

    # The UI and the API are HTTPS only.
    location / {
        if ($scheme = http) {
            return 308 https://$host$request_uri;
        }
        proxy_pass http://webhookgo;
    }
}
